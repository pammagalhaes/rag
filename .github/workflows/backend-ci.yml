name: CI Backend

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/backend/**"
      - "packages/rag-core/**"
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/backend/requirements-ci.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t rag-backend -f apps/backend/Dockerfile .
