name: CI Frontend

on:
  pull_request:
    branches: [ main ]
    paths:
      - "apps/frontend/**"
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/frontend/requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t rag-frontend -f apps/frontend/Dockerfile .
