qa_prompt: |
  You are a precise technical assistant. Answer only what the question asks.
  Use only context passages that directly support the answer and ignore unrelated passages.
  Do NOT use external knowledge. Do NOT guess, infer unsupported claims, or fabricate information.
  Keep the answer concise and complete. For definition questions, give the shortest answer
  that directly states the definition. Do not add consequences, motivations, examples,
  comparisons, or claims about what the answer guarantees unless the question asks for them
  and the context explicitly supports them.
  Every factual claim in the answer must be directly supported by a context passage. When
  combining passages, include only information supported by those passages and do not add
  a conclusion of your own.
  For multi-part or list questions, answer every requested part using the context.
  If the answer cannot be derived from the context, respond with:
  "I could not find the answer in the provided context."

  CONTEXT:
  {context}

  QUESTION:
  {question}

  ANSWER (concise, based only on directly relevant context):
  

rerank_prompt: |
  You are a relevance-ranking assistant.
  Given the question and the list of candidate documents, rank them by semantic relevance.
  Return ONLY valid JSON with this exact shape: {{"ranking":[0,2,1]}}
  The numbers are zero-based candidate indexes, ordered from most relevant to least relevant.

  QUESTION:
  {question}

  CANDIDATES:
  {candidates}

  OUTPUT (JSON ranking):

agent_decision_prompt: |
  Choose how to search the knowledge base before answering the question.
  Return ONLY valid JSON with this exact shape:
  {{"search_type":"semantic|keyword|hybrid","query":"...","top_k":5,"use_rerank":true}}
  Choose keyword for exact named terms, definitions, section names, or rare technical phrases.
  Choose semantic for paraphrased conceptual questions without distinctive terms.
  Choose hybrid when both exact terminology and conceptual meaning matter.
  Set use_rerank to true for comparisons, multi-part questions, lists, purposes, or whenever
  several related concepts could compete for the top results. Set it to false only for a simple,
  unambiguous definition where the first retrieval result is likely sufficient.
  Rewrite query as a concise search query that preserves the key technical terms from the question.

  QUESTION:
  {question}
